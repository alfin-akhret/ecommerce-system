groups:
  - name: ecommerce-alerts
    rules:
      # HIGH ERROR RATE
      - alert: HighErrorRate
        expr: rate(http_errors_total[1m]) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above threshold"
      
      # HIGH LATENCY
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(
            0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)
          ) > 1
          AND
          sum(rate(http_requests_total[1m])) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High latency (p95)"
          description: "P95 latency > 1s"

      # HIGH LOAD (IN-FLIGHT)
      - alert: HighInFlightRequests
        expr: http_requests_in_flight > 50
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Too many concurrent requests"
          description: "Possible overload"