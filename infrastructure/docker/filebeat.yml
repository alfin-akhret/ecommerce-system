filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log

setup.kibana:
  host: "kibana:5601"

processors:
  - add_docker_metadata: {}
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
